[package]
name = "bibliochad"
description = "BiblioChad: an ebook reader whose library is your Google Drive"
version.workspace = true
edition.workspace = true
publish = false
default-run = "bibliochad"

[lib]
name = "bibliochad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bc-core = { path = "../crates/bc-core" }
bc-drive = { path = "../crates/bc-drive" }
bc-library = { path = "../crates/bc-library" }
bc-reader = { path = "../crates/bc-reader" }
bc-sync = { path = "../crates/bc-sync" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
lru = "0.12"
