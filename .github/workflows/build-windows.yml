name: Build Windows

# Shared by ci.yml (every push) and release.yml (version tags).
on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.arch }} · native build + installer
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            pdfium: win-arm64
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain info
        run: rustc -vV
      - name: PDFium (${{ matrix.pdfium }})
        shell: pwsh
        run: .\scripts\fetch-pdfium.ps1 -Platform ${{ matrix.pdfium }}
      - name: Rust tests
        if: inputs.run-tests
        shell: pwsh
        env:
          PDFIUM_DIR: ${{ github.workspace }}\src-tauri\resources\pdfium
        run: |
          python scripts/make-test-corpus.py
          $env:BC_TEST_PDF = "$PWD\test-corpus\chad-test.pdf"
          cargo test --workspace --exclude bibliochad --target ${{ matrix.target }}
      - name: Build installer (NSIS + MSI)
        shell: pwsh
        run: |
          npm ci
          npm --prefix ui ci
          npx tauri build --target ${{ matrix.target }}
      - name: Portable zip (exe + pdfium side by side)
        shell: pwsh
        run: |
          $p = "portable\BiblioChad"
          New-Item -ItemType Directory -Force -Path "$p\pdfium" | Out-Null
          Copy-Item target\${{ matrix.target }}\release\bibliochad.exe $p
          Copy-Item src-tauri\resources\pdfium\pdfium.dll "$p\pdfium\"
          Copy-Item src-tauri\resources\pdfium\PDFIUM_LICENSE.txt "$p\pdfium\" -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_NOTICES.md $p
          Compress-Archive -Path $p -DestinationPath portable\BiblioChad-portable-${{ matrix.arch }}.zip
      - name: Check binary architecture
        shell: pwsh
        run: |
          foreach ($f in @("target\${{ matrix.target }}\release\bibliochad.exe", "src-tauri\resources\pdfium\pdfium.dll")) {
            $b = [IO.File]::ReadAllBytes($f); $pe = [BitConverter]::ToInt32($b, 0x3c)
            $m = [BitConverter]::ToUInt16($b, $pe + 4)
            $want = @{ "arm64" = 0xAA64; "x64" = 0x8664 }["${{ matrix.arch }}"]
            Write-Host ("{0}: machine 0x{1:X4}" -f $f, $m)
            if ($m -ne $want) { throw "$f is not ${{ matrix.arch }}" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: bibliochad-windows-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            portable/BiblioChad-portable-${{ matrix.arch }}.zip
