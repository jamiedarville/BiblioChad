name: Build Linux

# Shared by ci.yml (every push) and release.yml (version tags).
on:
  workflow_call:

jobs:
  arch:
    name: x64 · Arch Linux package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # git must be present before checkout, or the PKGBUILD has no repo to read.
      - name: Build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust nodejs npm \
            webkit2gtk-4.1 gtk3 libsoup3 dbus xdg-utils hicolor-icon-theme
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder: .
          sudo -H -u builder git config --global --add safe.directory "$PWD"
          cd packaging/arch
          sudo -H -u builder makepkg --noconfirm
      - name: Install and check the package
        run: |
          pacman -U --noconfirm packaging/arch/bibliochad-*.pkg.tar.zst
          pacman -Ql bibliochad
          test -f /usr/lib/bibliochad/pdfium/libpdfium.so
          if ldd /usr/bin/bibliochad /usr/lib/bibliochad/pdfium/libpdfium.so | grep "not found"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bibliochad-linux-x64
          path: packaging/arch/bibliochad-*.pkg.tar.zst
