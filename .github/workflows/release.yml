name: Release

# Builds both Windows versions and publishes them as a GitHub Release.
# Start it either by pushing a tag like v0.1.0, or with "Run workflow" on the
# Actions tab (that creates the tag v<version from tauri.conf.json>).
# Asset names carry no version, so README links to
# releases/latest/download/<name> always fetch the newest build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-windows.yml
    with:
      run-tests: false

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bibliochad-windows-*
          path: dist
      - name: Collect assets with stable names
        run: |
          mkdir -p release
          for arch in x64 arm64; do
            d=dist/bibliochad-windows-$arch
            cp "$(find "$d" -name '*-setup.exe' | head -1)" "release/BiblioChad-Setup-$arch.exe"
            cp "$(find "$d" -name '*.msi' | head -1)"       "release/BiblioChad-$arch.msi"
            cp "$(find "$d" -name 'BiblioChad-portable-*.zip' | head -1)" "release/BiblioChad-Portable-$arch.zip"
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - name: Work out the tag
        run: |
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "v$app" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != app version v$app"; exit 1; }
          fi
          echo "TAG=v$app" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Download

          | Your PC | Installer | Other |
          |---|---|---|
          | **Intel / AMD** (x64) | [BiblioChad-Setup-x64.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-Setup-x64.exe) | [MSI](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-x64.msi) · [Portable zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-Portable-x64.zip) |
          | **ARM** (Snapdragon / Copilot+) | [BiblioChad-Setup-arm64.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-Setup-arm64.exe) | [MSI](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-arm64.msi) · [Portable zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/BiblioChad-Portable-arm64.zip) |

          Builds are not code-signed yet: Windows SmartScreen will warn on first run. Click **More info → Run anyway**.
          Checksums are in SHA256SUMS.txt.
          NOTES
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "BiblioChad $TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
