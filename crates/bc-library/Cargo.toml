[package]
name = "bc-library"
description = "BiblioChad SQLite library: schema, queries, metadata and covers"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bc-core = { path = "../bc-core" }
bc-reader = { path = "../bc-reader" }
bc-sync = { path = "../bc-sync" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
