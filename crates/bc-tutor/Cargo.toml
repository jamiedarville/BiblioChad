[package]
name = "bc-tutor"
description = "BiblioChad learning assistant: maps a Zone of Proximal Development for the passage you are reading"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# TLS comes from the shared client the app builds (see bc-drive for the
# per-platform TLS backends); this crate only needs JSON.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full"] }
